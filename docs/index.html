      cancelAnimationFrame(state.raf); state.raf = 0; disposeGPU();
      diagnostics.gpu = 'recovering';
      try {
        // One immediate retry, then fall back and schedule a bounded delayed upgrade.
        // Never restart CPU workers,
        // reset the timer, or recreate GPU resources after Stop/pagehide.
        if(backend === 'webgpu') {
          const retryWebGPU = state.gpuRecoveries++ === 0;
          diagnostics.gpuRecoveries = state.gpuRecoveries;
          await initGPU(version, retryWebGPU);
        } else state.backend = 'cpu-only';
      } catch(e) {
        if(version === state.runVersion && state.running) { disposeGPU(); state.backend = 'cpu-only'; showError(e); }
      } finally {
        if(version === state.runVersion && state.running) {
          state.gpuRecovering = false; diagnostics.gpu = state.backend;
          if(state.wakeActive && document.visibilityState === 'visible' && state.backend !== 'cpu-only') state.raf = requestAnimationFrame(frame);
          scheduleGPUUpgrade();
        }
      }
    }
    function scheduleGPUUpgrade() {
      if(!state.running || state.backend === 'webgpu' || state.gpuRetryTimer || state.gpuRetryAttempts >= 3) return;
      const version = state.runVersion;
      const retryTimer = setTimeout(async () => {
        if(state.gpuRetryTimer !== retryTimer || version !== state.runVersion) return;
        state.gpuRetryTimer = 0;
        if(version !== state.runVersion || !state.running || !state.wakeActive || document.visibilityState !== 'visible' || state.backend === 'webgpu') return;
        if(state.gpuRecovering) { scheduleGPUUpgrade(); return; }
        state.gpuRetryAttempts++; state.gpuRecovering = true;
        cancelAnimationFrame(state.raf); state.raf = 0; disposeGPU(); diagnostics.gpu = 'recovering';
        try { await initGPU(version); }
        catch(error) {
          if(version === state.runVersion && state.running) { disposeGPU(); state.backend = 'cpu-only'; showError(error); }
        } finally {
          if(version === state.runVersion && state.running) {
            state.gpuRecovering = false; diagnostics.gpu = state.backend;
            if(state.wakeActive && document.visibilityState === 'visible' && state.backend !== 'cpu-only') state.raf = requestAnimationFrame(frame);
            scheduleGPUUpgrade();
          }
        }
      }, 30000 * 2 ** state.gpuRetryAttempts);
      state.gpuRetryTimer = retryTimer;
    }
    function resumeDisplay() {
      if (!state.wakeActive || document.visibilityState !== 'visible') return;
      state.resizeNeeded = true; requestWakeLock(false);
    }
    ui.toggle.addEventListener('click', () => state.running ? stop() : start());
    addEventListener('resize', () => { state.resizeNeeded = true; ocean?.resize(); });
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') resumeDisplay();
      else stop();
    });
    addEventListener('pagehide', () => {
      state.wakeActive = false; stop(); clearInterval(state.statusTimer); state.statusTimer = 0;
    });
    addEventListener('pageshow', () => { state.wakeActive = true; resumeDisplay(); });
    addEventListener('focus', resumeDisplay);
    addEventListener('orientationchange', resumeDisplay);
    window.visualViewport?.addEventListener('resize', resumeDisplay);
    for(const type of ['pointerup','touchend','click','keydown']) document.addEventListener(type, () => requestWakeLock(false));
    function startStatusTimer() {
      if(state.statusTimer || !state.running) return;
      state.statusTimer = setInterval(() => {
        if(!state.wakeActive || document.visibilityState !== 'visible') return;
        requestWakeLock(false); updateElapsed();
      },1000);
    }
  })();
  </script>
