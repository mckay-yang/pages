<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:,">
  <title>耗电模式</title>
  <style>
    :root { color-scheme: light; --ink: #132d3c; --muted: #57727f; --blue: #55c4ef; --line: rgba(24,117,155,.17); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100svh; overflow-x: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    #gpu-canvas { opacity: 0; }
    main { position: relative; z-index: 2; min-height: 100svh; min-height: 100dvh; max-width: 1060px; margin: auto; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); display: grid; grid-template-rows: 64px minmax(300px, 1fr) auto; gap: 24px; }
    header { position: relative; display: flex; align-items: center; justify-content: center; }
    .fullscreen { position: absolute; left: 0; width: 52px; height: 52px; display: grid; place-items: center; background: transparent; border: 1px solid var(--line); border-radius: 16px; color: var(--ink); cursor: pointer; }
    .fullscreen svg { width: 23px; height: 23px; }
    .brand { margin: 0; font-size: 12px; font-weight: 650; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
    .hero { display: grid; place-content: center; justify-items: center; gap: 22px; padding: 28px 0; }
    .toggle { width: clamp(210px, 26vw, 280px); aspect-ratio: 1; border: 0; border-radius: 50%; background: var(--blue); color: #062b3d; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; -webkit-tap-highlight-color: transparent; transition: transform .16s; }
    .toggle:active { transform: scale(.975); }
    .toggle svg { width: 30px; height: 30px; fill: currentColor; }
    .toggle span { font-size: 30px; font-weight: 550; letter-spacing: .06em; }
    .toggle[data-running="true"] .play, .toggle[data-running="false"] .stop-icon { display: none; }
    button:focus-visible { outline: 3px solid #146384; outline-offset: 6px; }
    button:disabled { opacity: .55; cursor: default; }
    .status { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #93a9b3; }
    .status.running::before { background: #087754; }
    .dashboard { padding: 27px 32px 30px; border: 1px solid var(--line); border-radius: 30px; background: transparent; }
    .dashboard-title { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 25px; }
    .dashboard-title h2 { margin: 0; font-size: 14px; font-weight: 600; }
    .target { color: var(--muted); font-size: 11px; letter-spacing: .04em; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 27px 24px; }
    .metric { min-width: 0; }
    .label { color: var(--muted); font-size: 11px; margin-bottom: 7px; }
    .value { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: clamp(20px, 2.5vw, 29px); font-weight: 500; letter-spacing: -.04em; line-height: 1.2; white-space: nowrap; }
    .meta { min-height: 16px; margin-top: 7px; color: var(--muted); font-size: 10px; overflow-wrap: anywhere; }
    .error { display: none; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); color: #a62439; font-size: 12px; line-height: 1.5; white-space: pre-wrap; }
    .error.show { display: block; }
    .version { position: absolute; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); text-align: center; color: var(--muted); font-size: 10px; line-height: 1.2; }
    @media (min-height: 900px) { main { padding-bottom: max(80px, env(safe-area-inset-bottom)); } .hero { padding: 64px 0; } }
    @media (max-width: 600px) { main { grid-template-rows: 52px minmax(270px, 1fr) auto; gap: 18px; padding-left: 20px; padding-right: 20px; } .brand { font-size: 10px; } .fullscreen { width: 46px; height: 46px; border-radius: 14px; } .dashboard { padding: 23px; border-radius: 25px; } .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 25px 20px; } }
    @media (max-height: 650px) and (min-width: 700px) { main { grid-template-rows: 52px minmax(190px, 1fr) auto; gap: 12px; padding-bottom: 24px; } .hero { padding: 8px; gap: 10px; } .toggle { width: 170px; gap: 9px; } .toggle span { font-size: 25px; } .dashboard { padding: 20px 28px; } .dashboard-title { margin-bottom: 16px; } .metrics { gap: 17px 24px; } }
    @media (prefers-reduced-motion: reduce) { .toggle { transition: none; } }
  </style>
</head>
<body>
  <canvas id="gpu-canvas" aria-hidden="true"></canvas>
  <main>
    <header>
      <button id="fullscreen" class="fullscreen" type="button" aria-label="进入全屏" title="进入全屏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
      <h1 class="brand">耗电模式</h1>
    </header>
    <section class="hero" aria-label="耗电控制">
      <button id="toggle" class="toggle" type="button" data-running="false" aria-pressed="false" aria-label="开始耗电"><svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg><svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg><span id="toggle-label">开始</span></button>
      <div id="status-pill" class="status" role="status">待机</div>
    </section>
    <section class="dashboard" aria-label="运行数据">
      <div class="dashboard-title"><h2>运行数据</h2><span class="target">持续高负载</span></div>
      <div class="metrics">
        <div class="metric"><div class="label">运行时间</div><div id="m-elapsed" class="value">00:00:00</div><div class="meta">持续耗电</div></div>
        <div class="metric"><div class="label">CPU 工作线程</div><div id="m-workers" class="value">0</div><div id="m-cpu-active" class="meta">待机</div></div>
        <div class="metric"><div class="label">GPU 计算缓冲区</div><div id="m-buffer" class="value">0 MB</div><div id="buffer-detail" class="meta">开始时分配 · 停止时释放</div></div>
        <div class="metric"><div class="label">GPU 负载</div><div id="m-backend" class="value">待机</div><div id="gpu-detail" class="meta">持续高负载</div></div>
      </div>
      <div id="error" class="error" role="alert"></div>
    </section>
    <footer class="version" aria-label="版本号">v0.0.1</footer>
  </main>
  <script>
  (() => {

    const workerSource = "(function cpuWorker() {\n  // One dedicated thread continuously computes. The parent stops it with terminate().\n  self.onmessage = ({data: message}) => {\n    if (message.type !== 'start') return;\n    const values = new Float64Array(65536);\n    const ints = new Uint32Array(values.buffer);\n    for (let i = 0; i < values.length; i++) values[i] = ((i * .61803398875 + message.seed) % 1) + .001;\n    let rounds = 0, checksum = .1234567, lastReport = performance.now();\n    while (true) {\n      for (let pass = 0; pass < 4; pass++) {\n        for (let i = 0; i < values.length; i++) {\n          let x = values[i]; const y = values[(i + 7919) & 65535];\n          x = Math.sin(x + y) * Math.cos(x * .37) + Math.sqrt(Math.abs(y) + 1e-8);\n          let h = ints[(i * 2) & 131071] ^ i; h = Math.imul(h ^ (h >>> 16), 0x45d9f3b);\n          x = (x + (h & 255) * 1e-5) / (1.00001 + Math.abs(x) * 1e-5);\n          values[i] = x; checksum += x * 1e-9;\n        }\n        rounds += values.length;\n      }\n      if (!Number.isFinite(checksum)) checksum = .1234567;\n      const now = performance.now();\n      if (now - lastReport >= 500) {\n        self.postMessage({ rounds, checksum }); lastReport = now;\n      }\n    }\n  };\n})();";

    const renderWGSL = `
      struct Params { resolution: vec2<f32>, time: f32, raySteps: u32, fractalIterations: u32, pad0: u32, pad1: u32, pad2: u32 }

    function resizeCanvas() {

    function updateMetrics(now) {
      if(state.running) state.elapsed = now - state.startTime;
      ui['m-workers'].textContent = String(state.workers.length);
      ui['m-cpu-active'].textContent = state.running ? '持续计算 · ' + state.workerStats.size + ' 个已响应' : '已停止';
      ui['m-buffer'].textContent = state.gpu ? (state.gpu.elementCount * 4 / 1024 / 1024).toFixed(0) + ' MB' : state.backend === 'webgl2' ? '仅渲染' : '0 MB';
      ui['buffer-detail'].textContent = state.backend === 'webgl2' ? 'WebGL2 不运行计算缓冲区' : '开始时分配 · 停止时释放';
      ui['m-backend'].textContent = state.backend === 'cpu-only' ? '不可用' : state.backend === 'none' ? (state.running ? '检测中' : '待机') : state.running ? '运行中' : '待机';
      ui['gpu-detail'].textContent = state.backend === 'webgpu' ? 'WebGPU · 持续高负载' : state.backend === 'webgl2' ? 'WebGL2 · 持续高负载' : '持续高负载';
      ui['m-elapsed'].textContent = formatElapsed(state.elapsed);
    }
    function frame(now) {
      if(!state.running) return;
      if(state.resizeNeeded) resizeCanvas();
      let submitted = false;
      try {
        if(state.backend === 'webgpu') {
          // Prime both slots and refill only vacant slots on GPU completion.
          while(state.gpu.pending < 2) { if(!renderWebGPU(now)) break; submitted = true; }
        } else if(state.backend === 'webgl2') submitted = renderWebGL2(now);
      }
      catch(e) { handleGPUFailure({message:e.message},false); return; }
      // WebGPU is driven by completion; WebGL2 and an old pending batch use rAF.
      if(state.backend !== 'webgpu' || !submitted) state.raf = requestAnimationFrame(frame);
    }
    function syncToggle() {
      ui.toggle.dataset.running = String(state.running);
      ui.toggle.setAttribute('aria-pressed',String(state.running));
      ui.toggle.setAttribute('aria-label',state.running ? '停止耗电' : '开始耗电');
      ui['toggle-label'].textContent = state.running ? '停止' : '开始';
    }
    async function start() {
      if(state.running || state.gpuFault || !state.wakeActive || document.visibilityState !== 'visible') return;
      clearError(); const version = ++state.runVersion;
      state.running = true; state.startTime = performance.now(); state.elapsed = 0;
      state.gpuDispatches = 0;
      state.resizeNeeded = true;
      syncToggle(); ui['status-pill'].textContent = '准备中'; startStatusTimer(); requestWakeLock(false);
      try {
        await initGPU(version);
        if(!state.running || version !== state.runVersion || !state.wakeActive || state.gpuFault) return;
        startWorkers(); ui['status-pill'].textContent = '运行中'; ui['status-pill'].classList.add('running');
        updateMetrics(performance.now()); state.raf = requestAnimationFrame(frame);
      } catch(e) { if(version === state.runVersion) { showError(e); stop(); } }
    }
    function stop() {
      if(state.running) updateMetrics(performance.now());
      state.running = false; state.runVersion++; clearTimeout(state.wakeRetry); state.wakeRetry = 0;
      releaseWakeLock(); cancelAnimationFrame(state.raf); state.raf = 0; stopWorkers();
      clearInterval(state.statusTimer); state.statusTimer = 0; disposeGPU();
      syncToggle(); ui['status-pill'].textContent = '待机'; ui['status-pill'].classList.remove('running'); updateMetrics(performance.now());
    }
    function disposeGPU() {
      const gpu = state.gpu, fallback = state.gl;
      state.gpu = null; state.gl = null; state.backend = 'none';
      gpu?.context.unconfigure(); gpu?.device.destroy();
      fallback?.gl.getExtension('WEBGL_lose_context')?.loseContext();
      if(gpu || fallback) {
        const canvas = ui['gpu-canvas'];
        const replacement = canvas.cloneNode(false);
        canvas.replaceWith(replacement); ui['gpu-canvas'] = replacement;
      }
      state.resizeNeeded = true;
    }
    async function releaseSentinel(lock) {
      for(let attempt = 0; attempt < 3; attempt++) {
        try { if(!lock.released) await lock.release(); state.wakeLocks.delete(lock); return; }
        catch(e) {
          if(attempt === 2) { showError('唤醒锁释放失败，请关闭此标签页：' + e.message); return; }
          await new Promise(resolve => setTimeout(resolve, 200));
        }
      }
    }
    function scheduleWakeRetry() {
      clearTimeout(state.wakeRetry);
      if (state.running && state.wakeActive && document.visibilityState === 'visible' && 'wakeLock' in navigator) {
        state.wakeRetry = setTimeout(() => requestWakeLock(false), 3000);
      }
    }
    function releaseWakeLock() {
      state.wakeVersion++;
      const lock = state.wakeLock; state.wakeLock = null;
      if(lock) state.wakeLocks.add(lock);
      for(const held of state.wakeLocks) releaseSentinel(held);
      state.wakeStatus = state.running ? '页面已暂停，回到前台后恢复唤醒。' : '保持唤醒已关闭';
    }
    async function requestWakeLock(showFailure = true) {
      if (state.wakeLock?.released) state.wakeLock = null;
      if (!state.running || !state.wakeActive || state.wakePending || state.wakeLock || document.visibilityState !== 'visible') return;
      if (!('wakeLock' in navigator)) {
        state.wakeStatus = '耗电模式正在运行，但当前浏览器或连接不支持唤醒。';
        if (showFailure) showError('当前浏览器不支持 Screen Wake Lock，请使用 HTTPS 或 localhost。');
        return;
      }
      clearTimeout(state.wakeRetry);
      state.wakePending = true;
      const wakeVersion = state.wakeVersion;
      try {
        const lock = await navigator.wakeLock.request('screen');
        state.wakeLocks.add(lock);
        if (wakeVersion !== state.wakeVersion || !state.running || !state.wakeActive || document.visibilityState !== 'visible') { await releaseSentinel(lock); return; }
        state.wakeLock = lock; state.wakeStatus = '正在保持唤醒';
        lock.addEventListener('release', () => {
          state.wakeLocks.delete(lock);
          if (state.wakeLock !== lock) return;
          state.wakeLock = null;
          state.wakeStatus = state.running ? '系统已释放唤醒，前台自动重试。' : '保持唤醒已关闭';
          scheduleWakeRetry();
        });
        if (lock.released) { state.wakeLock = null; scheduleWakeRetry(); state.wakeStatus = '系统已释放唤醒，自动重试中。'; }
      } catch (e) {
        if (wakeVersion !== state.wakeVersion || !state.running || !state.wakeActive) return;
        state.wakeStatus = '耗电模式正在运行，浏览器暂未允许（' + (e.name || '请求失败') + '），将自动重试；点击页面或按键也会重试。';
        scheduleWakeRetry();
        if (showFailure) showError('无法保持唤醒：' + e.message);
      } finally {
        state.wakePending = false;
        if (wakeVersion !== state.wakeVersion && state.running && state.wakeActive && document.visibilityState === 'visible') requestWakeLock(false);
      }
    }

    function handleGPUFailure(info) {
      if (state.gpuFault) return;
      state.gpuFault = true; stop(); ui.toggle.disabled = true;
      showError('GPU 异常，耗电任务已停止，请刷新页面后再试。\n' + (info.message || info.reason || '原因未知'));
    }
    function resumeDisplay() {
      if (!state.wakeActive || document.visibilityState !== 'visible') return;
      state.resizeNeeded = true; requestWakeLock(false);
    }
    function syncFullscreen() {
      const active = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      ui.fullscreen.setAttribute('aria-label', active ? '退出全屏' : '进入全屏');
      ui.fullscreen.setAttribute('title', active ? '退出全屏' : '进入全屏');
      resumeDisplay();
    }
    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (!exit) throw new Error('当前 Safari 无法退出页面全屏。');
          await exit.call(document);
        } else {
          const root = document.documentElement;
          const enter = root.requestFullscreen || root.webkitRequestFullscreen;
          if (!enter) throw new Error('当前 Safari 不支持页面全屏。');
          await enter.call(root);
        }
        syncFullscreen();
      } catch (e) { showError('无法进入或退出全屏：' + e.message); }
    }

    ui.toggle.addEventListener('click', () => state.running ? stop() : start());
    ui.fullscreen.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', syncFullscreen);
    document.addEventListener('webkitfullscreenchange', syncFullscreen);
    addEventListener('resize', () => state.resizeNeeded = true);
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') resumeDisplay();
      else stop();
    });
    addEventListener('pagehide', () => {
      state.wakeActive = false; stop(); clearInterval(state.statusTimer); state.statusTimer = 0;
    });
    addEventListener('pageshow', () => { state.wakeActive = true; resumeDisplay(); });
    addEventListener('focus', resumeDisplay);
    addEventListener('orientationchange', resumeDisplay);
    window.visualViewport?.addEventListener('resize', resumeDisplay);
    for(const type of ['pointerup','touchend','click','keydown']) document.addEventListener(type, () => requestWakeLock(false));
    function startStatusTimer() {
      if(state.statusTimer || !state.running) return;
      state.statusTimer = setInterval(() => {
        if(!state.wakeActive || document.visibilityState !== 'visible') return;
        requestWakeLock(false); updateMetrics(performance.now());
      },1000);
    }
    updateMetrics(performance.now());
  })();
  </script>
</body>
</html>
