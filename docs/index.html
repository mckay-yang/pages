    function compileShader(gl, type, source) {
      const shader = gl.createShader(type); gl.shaderSource(shader, source); gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
      return shader;
    }
    function initWebGL2() {
      const gl = ui['gpu-canvas'].getContext('webgl2', { antialias: false, powerPreference: 'high-performance' });
      if (!gl) { state.backend = 'cpu-only'; return false; }
      const program = gl.createProgram();
      gl.attachShader(program, compileShader(gl, gl.VERTEX_SHADER, webglVertex)); gl.attachShader(program, compileShader(gl, gl.FRAGMENT_SHADER, webglFragment)); gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
      state.gl = { gl, program, uniforms: { res: gl.getUniformLocation(program,'res'), time: gl.getUniformLocation(program,'time'), steps: gl.getUniformLocation(program,'steps'), fractal: gl.getUniformLocation(program,'fractal') } };
      state.backend = 'webgl2'; return true;
    }
    async function initGPU(version) {
      try { if (await initWebGPU(version)) return; } catch (e) { showError(`WebGPU unavailable; using WebGL2 fallback.\n${e.message}`); }
      if(version !== state.runVersion || !state.running) return;
      try { initWebGL2(); } catch (e) { state.backend = 'cpu-only'; showError(`GPU initialization failed. CPU mode remains available.\n${e.message}`); }
    }

    function resizeCanvas() {
      const scale = gpuLoad().scale;
      const dpr = Math.min(devicePixelRatio || 1, 2) * scale;
      const width = Math.max(1, Math.floor(innerWidth * dpr));
      const height = Math.max(1, Math.floor(innerHeight * dpr));
      if (ui['gpu-canvas'].width !== width || ui['gpu-canvas'].height !== height) { ui['gpu-canvas'].width = width; ui['gpu-canvas'].height = height; }
      state.resizeNeeded = false;
    }
    function renderWebGPU(now) {
      const g = state.gpu, { device } = g;
      if (g.pending >= 2) return false;
      const version = state.runVersion;
      const encoder = device.createCommandEncoder();
      if (true) {
        const params = new ArrayBuffer(16), view = new DataView(params);
        view.setUint32(0, gpuLoad().iterations, true); view.setUint32(4, g.elementCount, true); view.setFloat32(8, now * 0.000001, true);
        device.queue.writeBuffer(g.computeUniform, 0, params);
        const pass = encoder.beginComputePass(); pass.setPipeline(g.computePipeline); pass.setBindGroup(0, g.computeBindGroup);
        const groups = Math.min(65535, Math.ceil(g.elementCount / 256));
        const dispatches = gpuLoad().dispatches;
        for (let i = 0; i < dispatches; i++) pass.dispatchWorkgroups(groups);
        pass.end(); state.gpuDispatches += dispatches;
      }
      if (true) {
        const params = new ArrayBuffer(32), view = new DataView(params);
        view.setFloat32(0, ui['gpu-canvas'].width, true); view.setFloat32(4, ui['gpu-canvas'].height, true); view.setFloat32(8, now / 1000, true);
        view.setUint32(12, gpuLoad().steps, true); view.setUint32(16, gpuLoad().fractal, true);
        device.queue.writeBuffer(g.renderUniform, 0, params);
        const pass = encoder.beginRenderPass({ colorAttachments: [{ view: g.context.getCurrentTexture().createView(), clearValue: {r:.01,g:.015,b:.025,a:1}, loadOp:'clear', storeOp:'store' }] });
        pass.setPipeline(g.renderPipeline); pass.setBindGroup(0, g.renderBindGroup); pass.draw(3); pass.end();
      }
      device.queue.submit([encoder.finish()]);
      g.pending++;
      device.queue.onSubmittedWorkDone().then(() => {
        g.pending = Math.max(0, g.pending - 1);
        // Refill immediately without waiting for the display refresh or a frame-rate target.
        if (state.running && version === state.runVersion && state.wakeActive && document.visibilityState === 'visible') frame(performance.now());
      }, e => {
        g.pending = Math.max(0, g.pending - 1); if(state.gpu === g) handleGPUFailure({ message: e.message });
      });
      return true;
    }
    function renderWebGL2(now) {

      const { gl, program, uniforms } = state.gl;
      gl.viewport(0, 0, gl.canvas.width, gl.canvas.height); gl.useProgram(program);
      gl.uniform2f(uniforms.res, gl.canvas.width, gl.canvas.height); gl.uniform1f(uniforms.time, now / 1000);
      gl.uniform1i(uniforms.steps, gpuLoad().steps); gl.uniform1i(uniforms.fractal, gpuLoad().fractal); gl.drawArrays(gl.TRIANGLES, 0, 3);
      return true;
    }


    function frame(now) {
      if(!state.running) return;
      if(state.resizeNeeded) resizeCanvas();
      let submitted = false;
      try {
        if(state.backend === 'webgpu') {
          // Prime both slots and refill only vacant slots on GPU completion.
          while(state.gpu.pending < 2) { if(!renderWebGPU(now)) break; submitted = true; }
        } else if(state.backend === 'webgl2') submitted = renderWebGL2(now);
      }
      catch(e) { handleGPUFailure({message:e.message},false); return; }
      // WebGPU is driven by completion; WebGL2 and an old pending batch use rAF.
      if(state.backend !== 'webgpu' || !submitted) state.raf = requestAnimationFrame(frame);
    }
    function syncToggle() {
      ui.toggle.dataset.running = String(state.running);
      ui.toggle.setAttribute('aria-pressed',String(state.running));
      ui.toggle.setAttribute('aria-label',state.running ? '停止耗电' : '开始耗电');
      ui['toggle-label'].textContent = state.running ? '停止' : '开始';
    }
    async function start() {
      if(state.running || !state.wakeActive || document.visibilityState !== 'visible') return;
      clearError(); state.gpuFault = false; const version = ++state.runVersion;
      state.running = true;
      state.gpuDispatches = 0;
      state.resizeNeeded = true;
      syncToggle(); startStatusTimer(); requestWakeLock(false);
      try {
        startWorkers(); startNeural(version);
        await initGPU(version);
        if(!state.running || version !== state.runVersion || !state.wakeActive || state.gpuFault) return;
        diagnostics.gpu = state.backend; state.raf = requestAnimationFrame(frame);
      } catch(e) { if(version === state.runVersion) { showError(e); stop(); } }
    }
    function stop() {
      state.running = false; state.runVersion++; clearTimeout(state.wakeRetry); state.wakeRetry = 0;
      releaseWakeLock(); cancelAnimationFrame(state.raf); state.raf = 0; stopWorkers(); disposeNeural();
      clearInterval(state.statusTimer); state.statusTimer = 0; disposeGPU();
      syncToggle(); diagnostics.gpu = 'stopped';
    }
    function disposeGPU() {
      const gpu = state.gpu, fallback = state.gl;
      state.gpu = null; state.gl = null; state.backend = 'none';
      gpu?.context.unconfigure(); gpu?.device.destroy();
      fallback?.gl.getExtension('WEBGL_lose_context')?.loseContext();
      if(gpu || fallback) {
        const canvas = ui['gpu-canvas'];
        const replacement = canvas.cloneNode(false);
        canvas.replaceWith(replacement); ui['gpu-canvas'] = replacement;
      }
      state.resizeNeeded = true;
    }
    async function releaseSentinel(lock) {
      for(let attempt = 0; attempt < 3; attempt++) {
        try { if(!lock.released) await lock.release(); state.wakeLocks.delete(lock); return; }
        catch(e) {
          if(attempt === 2) { showError('唤醒锁释放失败，请关闭此标签页：' + e.message); return; }
          await new Promise(resolve => setTimeout(resolve, 200));
        }
      }
    }
    function scheduleWakeRetry() {
      clearTimeout(state.wakeRetry);
      if (state.running && state.wakeActive && document.visibilityState === 'visible' && 'wakeLock' in navigator) {
        state.wakeRetry = setTimeout(() => requestWakeLock(false), 3000);
      }
    }
    function releaseWakeLock() {
      state.wakeVersion++;
      const lock = state.wakeLock; state.wakeLock = null;
      if(lock) state.wakeLocks.add(lock);
      for(const held of state.wakeLocks) releaseSentinel(held);
      state.wakeStatus = state.running ? '页面已暂停，回到前台后恢复唤醒。' : '保持唤醒已关闭';
    }
    async function requestWakeLock(showFailure = true) {
      if (state.wakeLock?.released) state.wakeLock = null;
      if (!state.running || !state.wakeActive || state.wakePending || state.wakeLock || document.visibilityState !== 'visible') return;
      if (!('wakeLock' in navigator)) {
        state.wakeStatus = '耗电模式正在运行，但当前浏览器或连接不支持唤醒。';
        if (showFailure) showError('当前浏览器不支持 Screen Wake Lock，请使用 HTTPS 或 localhost。');
        return;
      }
      clearTimeout(state.wakeRetry);
      state.wakePending = true;
      const wakeVersion = state.wakeVersion;
      try {
        const lock = await navigator.wakeLock.request('screen');
        state.wakeLocks.add(lock);
        if (wakeVersion !== state.wakeVersion || !state.running || !state.wakeActive || document.visibilityState !== 'visible') { await releaseSentinel(lock); return; }
        state.wakeLock = lock; state.wakeStatus = '正在保持唤醒';
        lock.addEventListener('release', () => {
          state.wakeLocks.delete(lock);
          if (state.wakeLock !== lock) return;
          state.wakeLock = null;
          state.wakeStatus = state.running ? '系统已释放唤醒，前台自动重试。' : '保持唤醒已关闭';
          scheduleWakeRetry();
        });
        if (lock.released) { state.wakeLock = null; scheduleWakeRetry(); state.wakeStatus = '系统已释放唤醒，自动重试中。'; }
      } catch (e) {
        if (wakeVersion !== state.wakeVersion || !state.running || !state.wakeActive) return;
        state.wakeStatus = '耗电模式正在运行，浏览器暂未允许（' + (e.name || '请求失败') + '），将自动重试；点击页面或按键也会重试。';
        scheduleWakeRetry();
        if (showFailure) showError('无法保持唤醒：' + e.message);
      } finally {
        state.wakePending = false;
        if (wakeVersion !== state.wakeVersion && state.running && state.wakeActive && document.visibilityState === 'visible') requestWakeLock(false);
      }
    }

    function handleGPUFailure(info) {
      if (state.gpuFault) return;
      state.gpuFault = true; stop(); ui['toggle-label'].textContent = '重试'; ui.toggle.setAttribute('aria-label', 'GPU 异常，点击重试');
      showError('GPU 异常，耗电任务已停止，点击按钮重试。\n' + (info.message || info.reason || '原因未知'));
    }
    function resumeDisplay() {
      if (!state.wakeActive || document.visibilityState !== 'visible') return;
      state.resizeNeeded = true; requestWakeLock(false);
    }
    ui.toggle.addEventListener('click', () => state.running ? stop() : start());
    addEventListener('resize', () => state.resizeNeeded = true);
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') resumeDisplay();
      else stop();
    });
    addEventListener('pagehide', () => {
      state.wakeActive = false; stop(); clearInterval(state.statusTimer); state.statusTimer = 0;
    });
    addEventListener('pageshow', () => { state.wakeActive = true; resumeDisplay(); });
    addEventListener('focus', resumeDisplay);
    addEventListener('orientationchange', resumeDisplay);
    window.visualViewport?.addEventListener('resize', resumeDisplay);
    for(const type of ['pointerup','touchend','click','keydown']) document.addEventListener(type, () => requestWakeLock(false));
    function startStatusTimer() {
      if(state.statusTimer || !state.running) return;
      state.statusTimer = setInterval(() => {
        if(!state.wakeActive || document.visibilityState !== 'visible') return;
        requestWakeLock(false);
      },1000);
    }
  })();
  </script>
</body>
